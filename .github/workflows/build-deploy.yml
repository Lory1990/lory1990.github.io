# https://github.com/gregrickaby/nextjs-github-pages

name: Github Page Deploy

on:
  push:
    branches: [main]

  # Manual rebuild, e.g. to pick up CMS content without pushing a commit.
  workflow_dispatch:

  # A post was published in the CMS.
  #
  # The site is static HTML: blog content is read from Sanity during
  # `pnpm build`, so a freshly published post only appears online after a new
  # build. The webhook configured in the Studio (see docs/blog.md) calls
  # GitHub's repository_dispatch API with this event_type and does exactly that.
  repository_dispatch:
    types: [sanity-publish]

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache Next
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}

      - run: pnpm install

      - name: Build
        env:
          NEXT_PUBLIC_EMAILJS_APIKEY: '${{ secrets.NEXT_PUBLIC_EMAILJS_APIKEY }}'
          NEXT_PUBLIC_EMAILJS_SERVICEID: '${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICEID }}'
          NEXT_PUBLIC_EMAILJS_TEMPLATE: '${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE }}'
          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: '${{ secrets.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}'
          SENTRY_AUTH_TOKEN: '${{ secrets.SENTRY_AUTH_TOKEN }}'
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
